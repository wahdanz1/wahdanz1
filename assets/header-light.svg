<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#g2)" opacity="0.08"/>

  <g transform="translate(160, 160)" stroke="url(#g1)" stroke-width="1.2" opacity="0.85" filter="url(#glow)">
    <circle r="60"/>
    <circle r="60" cx="60" cy="0"/>
    <circle r="60" cx="-60" cy="0"/>
    <circle r="60" cx="30" cy="52"/>
    <circle r="60" cx="-30" cy="52"/>
    <circle r="60" cx="30" cy="-52"/>
    <circle r="60" cx="-30" cy="-52"/>
  </g>

  <g stroke="url(#g1)" stroke-width="0.6" opacity="0.5">
    <line x1="280" y1="160" x2="560" y2="160"/>
    <line x1="280" y1="140" x2="540" y2="100"/>
    <line x1="280" y1="180" x2="540" y2="220"/>
  </g>

  <g fill="url(#g1)">
    <circle cx="280" cy="160" r="3"/>
    <circle cx="540" cy="100" r="2"/>
    <circle cx="540" cy="220" r="2"/>
    <circle cx="560" cy="160" r="3"/>
  </g>

  <text x="600" y="140" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="56" font-weight="600" fill="#18181b">daniel wahlgren</text>
  <text x="600" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#52525b">developer  ·  designer  ·  perpetual student</text>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#a1a1aa">
    <text x="1108" y="40">57.7°N</text>
    <text x="1108" y="56">11.9°E</text>
    <text x="1108" y="296">v.2026</text>
  </g>

  <g transform="translate(1100, 250)" stroke="url(#g1)" stroke-width="1" fill="none" opacity="0.7">
    <polygon points="0,-20 17,10 -17,10"/>
    <circle r="10"/>
  </g>
</svg>
